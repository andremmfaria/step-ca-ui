# Included by EVERY location that proxies. proxy_set_header inherits
# all-or-nothing per level, so a location defining its own subset silently
# loses the rest (D5 rule 2).
#
# X-Forwarded-For alone is not enough: clientFromHeaders walks XFF right to
# left, skips entries that are themselves trusted, and falls through to
# X-Real-IP then True-Client-IP when XFF yields nothing. With the replace form
# XFF holds one trusted entry, so that fallback fires on every request unless
# these are set and cleared too (D5 rule 1).
proxy_set_header Host            $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header True-Client-IP  "";
proxy_set_header Forwarded       "";
