# Phase 0 step 10 spike. Proves D5 rules 1, 2 and 7 ONLY.
# NOT the end state: no TLS termination, no second certificate, and
# proxy_ssl_verify is off because the backend's default UI_TLS_MODE=self-signed
# leaf cannot be verified. Verification is Phase 3b, with its own leaf.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

server {
    listen 8080;
    server_name _;

    location / {
        include conf.d/proxy-headers.conf;

        # Rule 7: a literal hostname resolves once at config load, so a backend
        # restart would 502 permanently. The variable forces re-resolution.
        # $request_uri is mandatory: with a variable in proxy_pass nginx drops
        # the matched URI.
        set $backend "step-ui:8443";
        proxy_pass https://$backend$request_uri;
        proxy_ssl_verify off;
    }
}
