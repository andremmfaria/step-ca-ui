version: "2"

linters:
  default: none
  enable:
    # Original set (kept)
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    # Added in PR-0
    - revive
    - gocritic
    - errorlint
    - bodyclose
    - noctx
    - gosec
    - unconvert
    - unparam
    # Added in PR-23 now that log/slog is adopted
    - sloglint
    # Added in Phase 1 of plans/frontend-backend-split.md
    - depguard
    - gomodguard_v2

  settings:
    depguard:
      rules:
        # apitypes is what cmd/openapi and the middleware chain both build on,
        # so it must stay free of anything that needs a database, a CA client
        # or an environment. An allowlist, not a denylist: a denylist is
        # defeated by an aliasing package that re-exports the forbidden one.
        apitypes:
          files:
            - "**/apitypes/**"
          allow:
            - $gostd
            - step-ui/apitypes
        # api/ describes and enforces the contract; the row types belong to
        # handlers, which is what keeps a database type from reaching a DTO.
        api:
          files:
            - "**/api/*.go"
            - "!**/api/*_test.go"
          deny:
            - pkg: step-ui/models
              desc: "api/ must not name a database row type; DTOs live in apitypes and handlers own the rows (Section 2)"
            - pkg: step-ui/db
              desc: "api/ must not reach the database directly; go through handlers (Section 2)"
    gomodguard_v2:
      blocked:
        - module: github.com/rs/cors
          reason: "the SPA and the API share one origin (D1), so no CORS grant is ever correct here"
        - module: github.com/go-chi/cors
          reason: "the SPA and the API share one origin (D1), so no CORS grant is ever correct here"
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-tags:
        - opinionated
        - experimental
    gosec:
      excludes:
        # errcheck already covers unchecked errors (G104)
        - G104

  exclusions:
    paths:
      # node_modules installed locally for frontend linters — not Go source
      - node_modules/
    rules:
      # Suppress deprecated-symbol warnings on existing code — burn down in PR-23
      - linters: [staticcheck]
        text: "SA1019:"
      # Suppress style/quickfix staticcheck hints in existing code
      - linters: [staticcheck]
        text: "^QF"
      - linters: [staticcheck]
        text: "ST1005:"
      - linters: [staticcheck]
        text: "S1039:"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      # module-path tells gofumpt which import prefix is "local" so it can
      # produce the three-group layout (stdlib | external | local).
      module-path: step-ui
