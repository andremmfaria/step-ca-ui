# Mock IdP plus the OIDC/proxy keys the stock step-ui environment block omits.
# Applied by the scenario driver only when E2E_OIDC_ENABLED=1.
#
# The issuer URL must resolve identically for the app, the browser and the
# discovery document, so it is the compose service name and every party runs on
# step-network. h.initOIDC() calls gooidc.NewProvider at Handler construction
# and log.Fatalf's on discovery failure, so step-ui waits for the IdP to be
# healthy; the upstream image ships no HEALTHCHECK, hence the one below.
services:

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: mock-oidc
    environment:
      TZ: "${TZ:-UTC}"
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "scope",
                  "match": "*",
                  "claims": {
                    "sub": "e2e-manager",
                    "email": "e2e-manager@example.com",
                    "groups": ["e2e-managers"]
                  }
                }
              ]
            }
          ]
        }
    networks:
      - step-net

  # The readiness probe cannot live on mock-oidc itself: that image is
  # distroless, with no shell, no wget and no curl, so the healthcheck this
  # file used to carry could never pass and step-ui waited on it forever. The
  # wait moves to a throwaway container that exits 0 once discovery answers,
  # and step-ui depends on its completion instead.
  mock-oidc-ready:
    image: curlimages/curl:8.11.1
    container_name: mock-oidc-ready
    command:
      - sh
      - -c
      - |
        for i in $$(seq 1 60); do
          curl -sf http://mock-oidc:8080/default/.well-known/openid-configuration >/dev/null && exit 0
          sleep 1
        done
        echo "mock-oidc did not answer discovery in 60s" >&2
        exit 1
    depends_on:
      - mock-oidc
    networks:
      - step-net

  step-ui:
    environment:
      OIDC_ENABLED:       "${OIDC_ENABLED:-true}"
      OIDC_ISSUER_URL:    "${OIDC_ISSUER_URL:-http://mock-oidc:8080/default}"
      OIDC_CLIENT_ID:     "${OIDC_CLIENT_ID:-step-ui-e2e}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-step-ui-e2e-secret}"
      OIDC_REDIRECT_URL:  "${OIDC_REDIRECT_URL:-https://step-ui:8443/oidc/callback}"
      OIDC_GROUP_CLAIM:   "${OIDC_GROUP_CLAIM:-groups}"
      OIDC_GROUP_ADMIN:   "${OIDC_GROUP_ADMIN:-e2e-admins}"
      OIDC_GROUP_MANAGER: "${OIDC_GROUP_MANAGER:-e2e-managers}"
      OIDC_GROUP_VIEWER:  "${OIDC_GROUP_VIEWER:-e2e-viewers}"
      OIDC_DEFAULT_ROLE:  "${OIDC_DEFAULT_ROLE:-}"
      OIDC_SYNC_ROLE:     "${OIDC_SYNC_ROLE:-true}"

      LOCAL_LOGIN_ENABLED:  "${LOCAL_LOGIN_ENABLED:-true}"
      TRUST_PROXY:          "${TRUST_PROXY:-false}"
      TRUSTED_PROXY_CIDRS:  "${TRUSTED_PROXY_CIDRS:-}"
    depends_on:
      mock-oidc-ready:
        condition: service_completed_successfully
