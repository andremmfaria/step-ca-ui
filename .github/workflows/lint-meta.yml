name: Meta Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go (for actionlint)
        uses: actions/setup-go@v6.4.0
        with:
          go-version: stable
          cache: false

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: .github/
          config_file: .github/.yamllint.yml

  style:
    name: Frontend style (stylelint / eslint / djlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install frontend linters
        run: |
          npm install --no-save stylelint@^16 stylelint-config-standard@^37 eslint@^9
          pip install --quiet djlint==1.44.1

      - name: stylelint (CSS)
        run: |
          node_modules/.bin/stylelint \
            --config backend/.stylelintrc.json \
            --config-basedir "$(pwd)" \
            "backend/static/css/**/*.css"

      - name: eslint (JS)
        run: node_modules/.bin/eslint --config backend/eslint.config.js "backend/static/js/**/*.js"

      - name: djlint (Go templates — lint only; format burn-down is PR-23)
        run: djlint backend/templates/ --profile=golang --lint

      - name: Install the e2e harness
        run: npm ci
        working-directory: test/e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: tsc (e2e harness)
        run: npx tsc --noEmit
        working-directory: test/e2e

      - name: eslint (e2e harness)
        run: npx eslint .
        working-directory: test/e2e
