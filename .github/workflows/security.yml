name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run gosec
        uses: securego/gosec@v2.26.1
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./backend/...

      - name: Upload gosec SARIF
        if: ${{ hashFiles('gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3.36.0
        with:
          sarif_file: gosec.sarif
          category: gosec

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SARIF: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_EXIT_CODE: "1"

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          limit-severities-for-sarif: true

      - name: Upload Trivy fs SARIF
        if: ${{ hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3.36.0
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: trivy image scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build Docker image
        run: docker build -t step-ca-ui:ci -f backend/Dockerfile backend

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: step-ca-ui:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload Trivy image SARIF
        if: ${{ hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3.36.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
