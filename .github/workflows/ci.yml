name: CI

on:
  push:
    branches: [main]
    tags: ["client-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: THRESHOLD=15 bash scripts/coverage-gate.sh
        env:
          COVERPROFILE: coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: backend/coverage.out
          retention-days: 14

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          working-directory: backend

      - name: depguard rejects the negative fixture
        working-directory: .
        run: ./scripts/lint-fixtures.sh

  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stepui_test
          POSTGRES_PASSWORD: stepui_test
          POSTGRES_DB: stepui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run integration tests
        run: go test -tags=integration -race -count=1 ./db/...
        env:
          INTEGRATION_DB_DSN: postgres://stepui_test:stepui_test@localhost:5432/stepui_test?sslmode=disable
          STEPUI_ADMIN_PASSWORD: IntegrationTest123!

  client:
    name: Client package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: OpenAPI spec is current
        working-directory: backend
        run: |
          go run ./cmd/openapi -out openapi/openapi.json
          git diff --exit-code openapi/openapi.json \
            || { echo "::error::openapi.json is stale. Run: make openapi (go $(go version))"; exit 1; }

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.11.7

      - name: Breaking changes are recorded in docs/contract-changes.md
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/contract-gate.sh "$BASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@andremmfaria"

      - name: npm ci
        working-directory: clients/ts
        run: npm ci

      - name: Generate the client
        working-directory: clients/ts
        run: npm run generate

      - name: Build the client
        working-directory: clients/ts
        run: npm run build

      - name: Compute the client version
        id: client-version
        run: echo "version=$(./scripts/client-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Stamp the client version
        working-directory: clients/ts
        run: npm version "${{ steps.client-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: publint
        working-directory: clients/ts
        run: npm run publint

      - name: attw --pack
        working-directory: clients/ts
        run: npm run attw

      - name: npm pack
        working-directory: clients/ts
        run: |
          npm pack --pack-destination dist
          mv dist/andremmfaria-step-ca-ui-client-*.tgz dist/client.tgz

      - name: Upload the packed client
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ts-client
          path: clients/ts/dist/client.tgz
          retention-days: 14

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/client-v')
        working-directory: clients/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@andremmfaria/step-ca-ui-client@$VERSION" version >/dev/null 2>&1; then
            echo "already published at $VERSION, publish is idempotent"
          else
            npm publish ./dist/client.tgz
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: npm ci
        run: npm ci

      - name: Download the packed client
        uses: actions/download-artifact@v4.3.0
        with:
          name: ts-client
          path: /tmp/ts-client

      - name: Install the packed client
        run: npm install --no-save /tmp/ts-client/client.tgz

      - name: Provenance, the installed client matches this commit
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('@andremmfaria/step-ca-ui-client/package.json').version")
          case "$VERSION" in
            *"$SHORT_SHA") echo "installed client $VERSION carries commit $SHORT_SHA" ;;
            *) echo "::error::installed client version $VERSION does not contain commit $SHORT_SHA"; exit 1 ;;
          esac

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  contract-negative:
    name: Contract negative proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Determine relevance
        id: relevance
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "${{ github.sha }}" | grep -qE '^(\.github/workflows/ci\.yml|clients/ts/|backend/cmd/openapi/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.relevance.outputs.run == 'true'
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Regenerate the spec
        if: steps.relevance.outputs.run == 'true'
        working-directory: backend
        run: go run ./cmd/openapi -out openapi/openapi.json

      - name: Set up Node
        if: steps.relevance.outputs.run == 'true'
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: npm ci
        if: steps.relevance.outputs.run == 'true'
        working-directory: clients/ts
        run: npm ci

      - name: Generate and build the client
        if: steps.relevance.outputs.run == 'true'
        working-directory: clients/ts
        run: |
          npm run generate
          npm run build

      - name: Stamp a regressed version missing the commit sha
        if: steps.relevance.outputs.run == 'true'
        working-directory: clients/ts
        run: npm version "0.1.0-sha.0000000" --no-git-tag-version --allow-same-version

      - name: Pack the regressed client
        if: steps.relevance.outputs.run == 'true'
        working-directory: clients/ts
        run: npm pack --pack-destination dist

      - name: The provenance gate rejects it
        if: steps.relevance.outputs.run == 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/contract-negative
          cd /tmp/contract-negative
          npm init -y >/dev/null
          npm install --no-save "$GITHUB_WORKSPACE"/clients/ts/dist/andremmfaria-step-ca-ui-client-*.tgz
          VERSION=$(node -p "require('@andremmfaria/step-ca-ui-client/package.json').version")
          case "$VERSION" in
            *"$SHORT_SHA") echo "::error::a client missing the commit sha was accepted ($VERSION)"; exit 1 ;;
            *) echo "correctly rejected: $VERSION does not contain $SHORT_SHA" ;;
          esac

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [build-test-lint, db-integration, client, frontend]
    if: always()
    steps:
      - name: All required jobs succeeded
        run: |
          for r in "${{ needs.build-test-lint.result }}" "${{ needs.db-integration.result }}" \
                   "${{ needs.client.result }}" "${{ needs.frontend.result }}"; do
            [ "$r" = success ] || { echo "::error::a required job did not succeed ($r)"; exit 1; }
          done
