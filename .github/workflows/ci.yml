name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: THRESHOLD=15 bash scripts/coverage-gate.sh
        env:
          COVERPROFILE: coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: backend/coverage.out
          retention-days: 14

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          working-directory: backend

      - name: depguard rejects the negative fixture
        working-directory: .
        run: ./scripts/lint-fixtures.sh

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: OpenAPI spec is current
        working-directory: backend
        run: |
          go run ./cmd/openapi -out openapi/openapi.json
          git diff --exit-code openapi/openapi.json \
            || { echo "::error::openapi.json is stale. Run: make openapi (go $(go version))"; exit 1; }

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.11.7

      - name: Breaking changes are recorded in docs/contract-changes.md
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/contract-gate.sh "$BASE_SHA"

  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stepui_test
          POSTGRES_PASSWORD: stepui_test
          POSTGRES_DB: stepui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run integration tests
        run: go test -tags=integration -race -count=1 ./db/...
        env:
          INTEGRATION_DB_DSN: postgres://stepui_test:stepui_test@localhost:5432/stepui_test?sslmode=disable
          STEPUI_ADMIN_PASSWORD: IntegrationTest123!
