# Local ACME server for the Let's Encrypt leg. Applied by the scenario driver
# only when E2E_LE_ENABLED=1.
#
# Two things have to line up for issuance to complete:
#   - step-ui must trust pebble's root, hence LEGO_CA_CERTIFICATES. lego's own
#     HTTP client reads that variable; nothing else in the tree does.
#   - pebble must reach the HTTP-01 challenge lego serves on step-ui:80, hence
#     httpPort 80 in the mounted config. Docker's embedded DNS resolves the
#     challenge domain, so the domain under test must be a compose service name.
#
# The certificates under test/e2e/fixtures/pebble/certs are generated by
# `make e2e-le-certs`; pebble's own shipped cert has no SAN for the service
# name step-ui dials, so its root cannot be reused as-is.
services:

  pebble:
    image: ghcr.io/letsencrypt/pebble:v2.7.0
    container_name: pebble
    environment:
      TZ: "${TZ:-UTC}"
      PEBBLE_VA_NOSLEEP: "1"
    command: ["-config", "/test/config/pebble-config.json", "-strict"]
    volumes:
      - ./test/e2e/fixtures/pebble/pebble-config.json:/test/config/pebble-config.json:ro
      - ./test/e2e/fixtures/pebble/certs:/test/certs/e2e:ro
    networks:
      - step-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost:14000/dir"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  step-ui:
    environment:
      LE_ACME_DIRECTORY_URL: "${LE_ACME_DIRECTORY_URL:-https://pebble:14000/dir}"
      LEGO_CA_CERTIFICATES:  /opt/step-ui/pebble/minica.pem
    volumes:
      - ./test/e2e/fixtures/pebble/certs/minica.pem:/opt/step-ui/pebble/minica.pem:ro
    depends_on:
      pebble:
        condition: service_healthy
